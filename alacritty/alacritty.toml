# Alacritty Configuration
# Converted from Kitty configuration

[window]
# Window opacity (0.0 - 1.0)
# opacity = 1.0

# Window padding
padding.x = 2
padding.y = 2

# Window decorations
# - Full: borders and title bar
# - None: neither borders nor title bar
decorations = "Full"

[scrolling]
# Maximum number of lines in the scrollback buffer
history = 10000

# Number of lines scrolled for every input scroll increment
multiplier = 3

[font]
# Font configuration
normal.family = "monospace"
# normal.style = "Regular"

bold.family = "monospace"
# bold.style = "Bold"

italic.family = "monospace"
# italic.style = "Italic"

bold_italic.family = "monospace"
# bold_italic.style = "Bold Italic"

# Font size in points
size = 14.0

# Offset is the extra space around each character
# offset.x = 0
# offset.y = 0

# Glyph offset determines the locations of the glyphs within their cells
# glyph_offset.x = 0
# glyph_offset.y = 0

[colors]
# Gruvbox Dark color scheme
# Based on https://github.com/morhetz/gruvbox

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.cursor]
cursor = "#928374"
text = "#282828"

[colors.selection]
background = "#ebdbb2"
text = "#928374"

[colors.normal]
black = "#665c54"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#7c6f64"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#bdae93"

[bell]
# Visual bell animation
# animation = "EaseOutExpo"
# duration = 0
# color = "#8ec07c"

[selection]
# This string contains all characters that are used as separators for "semantic words" in Alacritty
semantic_escape_chars = ",│`|:\"' ()[]{}<>\\t"

# When set to true, selected text will be copied to the primary clipboard
save_to_clipboard = false

[cursor]
# Cursor style
# style.shape = "Block"
# style.blinking = "Off"

# Vi mode cursor style
# vi_mode_style.shape = "Block"
# vi_mode_style.blinking = "Off"

# Cursor blinking interval in milliseconds
# blink_interval = 750

# If this is true, the cursor will be rendered as a hollow box when unfocused
unfocused_hollow = true

[mouse]
# Click settings
# double_click.threshold = 300
# triple_click.threshold = 300

# If this is true, the cursor is temporarily hidden when typing
hide_when_typing = false

[hints]
# Terminal hints (like URL hints)
# alphabet = "jfkdls;ahgurieowpq"

# [[hints.enabled]]
# regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001f\u007f-\u009f<>\"\\s{-}\\^⟨⟩`]+"
# command = "xdg-open"
# post_processing = true
# mouse.enabled = true
# mouse.mods = "None"
# binding.key = "U"
# binding.mods = "Control|Shift"

[keyboard]
# Key bindings
# bindings = []

# Example key bindings (commented out)
# [[keyboard.bindings]]
# key = "V"
# mods = "Control|Shift"
# action = "Paste"

# [[keyboard.bindings]]
# key = "C"
