#################################
# Picom Configuration
# Matching Hyprland compositor settings
#################################

#################################
# Backend
#################################

# Backend to use: "xrender", "glx", or "egl"
backend = "glx";

# Enable/disable VSync
vsync = true;

#################################
# GLX backend
#################################

glx-no-stencil = true;
glx-no-rebind-pixmap = true;

#################################
# Shadows
#################################

# Shadows disabled (matching Hyprland config with drop_shadow = false)
shadow = false;

#################################
# Fading
#################################

# Fade windows in/out when opening/closing (matching Hyprland's animation style)
fading = true;

# Opacity change between steps while fading in (default: 0.028)
fade-in-step = 0.03;

# Opacity change between steps while fading out (default: 0.03)
fade-out-step = 0.03;

# The time between steps in fade step, in milliseconds (default: 10)
fade-delta = 4;

# Don't fade on window open/close
no-fading-openclose = false;

# Specify a list of conditions of windows that should not be faded
fade-exclude = [];

#################################
# Transparency / Opacity
#################################

# Opacity of inactive windows (matching Hyprland: inactive_opacity = 1.0)
inactive-opacity = 1.0;

# Opacity of window titlebars and borders
frame-opacity = 1.0;

# Default opacity for active windows
active-opacity = 1.0;

# Let inactive opacity set by -i override the '_NET_WM_WINDOW_OPACITY' values of windows
inactive-opacity-override = false;

# Specify a list of opacity rules
opacity-rule = [];

#################################
# Corners
#################################

# Rounded corners (matching Hyprland: rounding = 5)
corner-radius = 5;

# Exclude conditions for rounded corners
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
# Background-Blurring
#################################

# Blur disabled (matching Hyprland: blur enabled = false)
blur-method = "none";
blur-background = false;

#################################
# General Settings
#################################

# Enable remote control via D-Bus
dbus = false;

# Daemonize process
daemon = false;

# Try to detect WM windows and mark them as active
mark-wmwin-focused = true;

# Mark override-redirect windows that doesn't have a child window with 'WM_STATE' focused
mark-ovredir-focused = true;

# Use EWMH '_NET_ACTIVE_WINDOW' to determine currently focused window
use-ewmh-active-win = true;

# Detect rounded corners and treat them as rectangular
detect-rounded-corners = true;

# Detect '_NET_WM_WINDOW_OPACITY' on client windows
detect-client-opacity = true;

# Use 'WM_TRANSIENT_FOR' to group windows
detect-transient = true;

# Use 'WM_CLIENT_LEADER' to group windows
detect-client-leader = true;

# Unredirect all windows if a full-screen opaque window is detected
unredir-if-possible = true;

#################################
# Window type settings
#################################

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 1.0; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 1.0; shadow = false; }
  dropdown_menu = { opacity = 1.0; shadow = false; }
};

