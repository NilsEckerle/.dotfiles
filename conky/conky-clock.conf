conky.config = {
  -- Basic settings
    background = true,
  use_xft = true,
  font = 'FiraCode Nerd Font:size=48',

  -- Position and size
    alignment = 'top_right',
  gap_x = 50,
  gap_y = 50,

  -- Window settings
    own_window = true,
  own_window_type = 'override',
  own_window_transparent = true,
  own_window_argb_visual = true,
  own_window_argb_value = 0,
  own_window_colour = '1c1f20',
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  own_window_class = 'conky-clock',

  -- Performance
    update_interval = 1.0,
  total_run_times = 0,

  -- Buffering
    double_buffer = true,
  no_buffers = false,
  text_buffer_size =2048,

  -- Colors (Gruvbox theme)
    default_color = 'ebdbb2',  -- Gruvbox light
    color1 = 'fabd2f',         -- Gruvbox yellow
    color2 = 'b8bb26',         -- Gruvbox green
    color3 = 'fb4934',         -- Gruvbox red

    -- Text settings
    uppercase = false,
  use_spacer = 'none',

  -- Borders and outlines for better visibility
    draw_outline = true,
  outline_colour = '1c1f20',  -- Gruvbox dark background
    draw_borders = false,

  -- Shadow for text readability
    draw_shades = true,
  default_shade_color = '1d2021',  -- Gruvbox darker
}

conky.text = [[
  ${color1}${font FiraCode Nerd Font:size=64}${time %H:%M:%S}${font}
  ${color2}${font FiraCode Nerd Font:size=32}${time %d.%m.%Y}${font}
]]
