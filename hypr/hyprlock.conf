# Gruvbox Dark Hyprlock Configuration

# General settings
general {
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
    disable_loading_bar = false
}

# Background
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Input field
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(251, 241, 199, 1.0)  # rosewater
    inner_color = rgba(40, 40, 40, 1.0)     # base
    font_color = rgba(235, 219, 178, 1.0)   # text
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span foreground="##bdae93">Enter Password...</span>
    hide_input = false
    rounding = -1
    check_color = rgba(184, 187, 38, 1.0)   # green
    fail_color = rgba(251, 73, 52, 1.0)     # red
    fail_text = <span foreground="##fb4934">$FAIL ($ATTEMPTS)</span>
    fail_transition = 300
    capslock_color = rgba(250, 189, 47, 1.0)  # yellow
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    
    position = 0, -120
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(235, 219, 178, 1.0)  # text
    font_size = 120
    font_family = JetBrains Mono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(213, 196, 161, 1.0)  # subtext1
    font_size = 24
    font_family = JetBrains Mono Nerd Font
    position = 0, 50
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = cmd[update:0] echo "Hi, $(echo $USER | sed 's/./\U&/')"
    color = rgba(142, 192, 124, 1.0)  # teal
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    position = 0, -180
    halign = center
    valign = center
}

