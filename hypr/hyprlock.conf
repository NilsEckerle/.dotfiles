    monitor =
    text = cmd[update:60000] echo "Uptime: $(uptime -p | sed 's/up //')"
    color = rgba(189, 174, 147, 1.0)  # subtext0
    font_size = 14
    font_family = JetBrains Mono Nerd Font
    position = 50, 20
    halign = left
    valign = bottom
}
