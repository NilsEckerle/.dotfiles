general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after suspend
    ignore_dbus_inhibit = false                 # respect applications that inhibit idle
}

# Dim screen after 10 minutes
listener {
    timeout = 600
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock after 15 minutes
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# Turn off screen after 5 minutes of being locked (20 min total)
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
    on-lock = hyprctl dispatch dpms on
}

# Suspend after 5 more minutes of screen off (25 min total)
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
