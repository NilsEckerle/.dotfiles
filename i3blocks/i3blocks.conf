# i3blocks config file
# Configured to match Waybar layout: workspaces | cpu, memory, pulseaudio, clock, mail, tray
#
# Global properties
separator_block_width=8
markup=pango
separator=false

# Gruvbox colors (matching waybar style)
# bg0=#282828  fg1=#ebdbb2  gray=#928374  orange=#fe8019  
# yellow=#fabd2f  green=#b8bb26  blue=#83a598  red=#fb4934

# CPU usage (matching waybar cpu module)
[cpu_usage]
command=echo " $(mpstat 1 1 | awk '/Average/ {printf "%.0f%%", 100-$NF}')"
interval=5
color=#928374
separator_block_width=4

# Separator
[separator]
full_text=|
color=#504945
separator_block_width=4

# Memory usage (matching waybar memory module)
[memory]
command=echo " $(free | awk '/Mem:/ {printf "%.0f%%", $3/$2*100}')"
interval=5
color=#928374
separator_block_width=4

# Separator
[separator]
full_text=|
color=#504945
separator_block_width=4

# PulseAudio volume (matching waybar pulseaudio module)
[volume]
command=~/.config/i3blocks/scripts/volume.sh
interval=1
signal=10
color=#928374
separator_block_width=4

# Separator
[separator]
full_text=|
color=#504945
separator_block_width=4

# Date and time (matching waybar clock format: %Y-%m-%d - %H:%M)
[time]
command=date '+%Y-%m-%d - %H:%M'
interval=60
color=#928374
separator_block_width=4

# Separator
[separator]
full_text=|
color=#504945
separator_block_width=4

# Mail indicator (matching waybar custom/mail)
[mail]
command=echo "✉"
interval=300
color=#928374
separator_block_width=8

